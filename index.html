<title>El Vacilón del BSN — Volvemos pronto</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:radial-gradient(ellipse 90% 50% at 50% 28%,rgba(247,224,18,.12),transparent 62%),radial-gradient(ellipse 130% 80% at 50% 115%,rgba(6,105,212,.30),transparent 58%),#051d49;color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 20px;overflow:hidden;position:relative}
  /* líneas de cancha de fondo */
  body::before{content:"";position:absolute;inset:0;background:
    radial-gradient(circle at 50% 42%,transparent 118px,rgba(247,224,18,.14) 119px,rgba(247,224,18,.14) 121px,transparent 122px);}
  .court-line{position:absolute;left:50%;top:42%;width:2px;height:58%;background:rgba(247,224,18,.10);transform:translateX(-50%)}
  body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 115% 115% at 50% 45%,transparent 52%,rgba(0,2,12,.6) 100%)}
  .ray{position:absolute;left:50%;top:-4%;width:340px;height:72%;transform:translateX(-50%);z-index:0;pointer-events:none;background:linear-gradient(rgba(247,224,18,.13),rgba(247,224,18,.02) 65%,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(6px)}
  .dust{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .dust span{position:absolute;bottom:-12px;border-radius:50%;background:rgba(247,224,18,.55);filter:blur(.4px);animation:sube linear infinite}
  @keyframes sube{to{transform:translateY(-112vh)}}
  .card{position:relative;z-index:2;max-width:560px}
  .badge{display:inline-block;font-size:11px;letter-spacing:.42em;text-indent:.42em;font-weight:700;color:#051d49;background:#f7e012;padding:10px 22px 10px 24px;border-radius:999px;margin-bottom:34px}
  h1{font-size:clamp(38px,9vw,64px);font-weight:900;letter-spacing:.02em;line-height:1.05;margin-bottom:6px}
  h1 .amarillo{color:#f7e012}
  .sub{font-size:clamp(16px,4vw,20px);color:#c9d4f2;line-height:1.6;max-width:460px;margin:18px auto 0}
  .sub strong{color:#fafafa}
  /* balón rebotando (foto real) */
  .ball-wrap{height:172px;display:flex;align-items:flex-end;justify-content:center;margin:10px 0 4px}
  .ball{width:118px;height:118px;position:relative;animation:bote 1.15s cubic-bezier(.5,0,.5,1) infinite;filter:drop-shadow(0 20px 16px rgba(0,0,0,.5))}
  .ball img{width:100%;height:100%;display:block}
  @keyframes bote{0%,100%{transform:translateY(-64px) scale(1)}50%{transform:translateY(0) scale(1.06,.94)}}
  .sombra{width:74px;height:12px;background:rgba(0,0,0,.4);border-radius:50%;margin:10px auto 0;animation:sombra 1.15s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes sombra{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1);opacity:.6}}
  .pill{display:inline-block;margin-top:26px;font-size:12px;letter-spacing:.34em;text-indent:.34em;font-weight:700;color:#f7e012;border:1px solid rgba(247,224,18,.55);padding:12px 26px;border-radius:999px}
  footer{position:relative;z-index:2;margin-top:44px;font-size:12px;color:#8fa0c9;letter-spacing:.08em}
  footer b{color:#c9d4f2}
</style>
