<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Vacilón del BSN — Volvemos pronto</title>
<meta name="description" content="El Vacilón del BSN está en tiempo fuera. Volvemos pronto con más noticias, debate y candela del Baloncesto Superior Nacional.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:#051d49;color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 20px;overflow:hidden;position:relative}
  /* líneas de cancha de fondo */
  body::before{content:"";position:absolute;inset:0;background:
    radial-gradient(circle at 50% 42%,transparent 118px,rgba(247,224,18,.14) 119px,rgba(247,224,18,.14) 121px,transparent 122px);}
  .court-line{position:absolute;left:50%;top:42%;width:2px;height:58%;background:rgba(247,224,18,.10);transform:translateX(-50%)}
  .card{position:relative;z-index:2;max-width:560px}
  .badge{display:inline-block;font-size:11px;letter-spacing:.42em;text-indent:.42em;font-weight:700;color:#051d49;background:#f7e012;padding:10px 22px 10px 24px;border-radius:999px;margin-bottom:34px}
  h1{font-size:clamp(38px,9vw,64px);font-weight:900;letter-spacing:.02em;line-height:1.05;margin-bottom:6px}
  h1 .amarillo{color:#f7e012}
  .sub{font-size:clamp(16px,4vw,20px);color:#c9d4f2;line-height:1.6;max-width:460px;margin:18px auto 0}
  .sub strong{color:#fafafa}
  /* balón rebotando */
  .ball-wrap{height:150px;display:flex;align-items:flex-end;justify-content:center;margin:10px 0 4px}
  .ball{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f0924a,#e8722a 55%,#b54d14);position:relative;animation:bote 1.15s cubic-bezier(.5,0,.5,1) infinite;box-shadow:0 18px 24px -12px rgba(0,0,0,.55)}
  .ball::before{content:none}
  .ball::after{content:none}
  .seam{position:absolute;background:#3a2410}
  .seam.h{left:4px;right:4px;top:50%;height:3px;transform:translateY(-50%)}
  .seam.v{top:4px;bottom:4px;left:50%;width:3px;transform:translateX(-50%)}
  .seam.c1{left:8px;right:8px;top:8px;bottom:8px;border:3px solid #3a2410;border-radius:50%;background:transparent;border-left-color:transparent;border-right-color:transparent}
  @keyframes bote{0%,100%{transform:translateY(-64px) scale(1)}50%{transform:translateY(0) scale(1.06,.94)}}
  .sombra{width:74px;height:12px;background:rgba(0,0,0,.4);border-radius:50%;margin:10px auto 0;animation:sombra 1.15s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes sombra{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1);opacity:.6}}
  .pill{display:inline-block;margin-top:26px;font-size:12px;letter-spacing:.34em;text-indent:.34em;font-weight:700;color:#f7e012;border:1px solid rgba(247,224,18,.55);padding:12px 26px;border-radius:999px}
  footer{position:relative;z-index:2;margin-top:44px;font-size:12px;color:#8fa0c9;letter-spacing:.08em}
  footer b{color:#c9d4f2}
</style>
</head>
<body>
<div class="court-line"></div>
<div class="card">
  <span class="badge">EL VACILÓN DEL BSN</span>
  <div class="ball-wrap"><div class="ball"><span class="seam h"></span><span class="seam v"></span><span class="seam c1"></span></div></div>
  <div class="sombra"></div>
  <h1 style="margin-top:26px">¡Tiempo <span class="amarillo">fuera</span>!</h1>
  <p class="sub">El vacilón está en el <strong>camerino</strong> recargando energías.<br>Volvemos pronto con más noticias, más debate y más <strong>candela</strong> del BSN.</p>
  <span class="pill">PÁGINA EN CONSTRUCCIÓN</span>
  <footer>© 2026 <b>El Vacilón del BSN</b> · Hecho por <b>AR Creative Web</b></footer>
</div>
</body>
</html>
